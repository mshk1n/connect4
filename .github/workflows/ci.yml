name: Scala CI with SBT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up SBT
      uses: sbt/setup-sbt@v1

    - name: Run tests and upload to Coveralls
      run: xvfb-run sbt clean coverage test coverageReport coveralls
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Mutation Tests (Stryker4s)
      run: sbt stryker